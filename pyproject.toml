[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rutinkompis"
version = "0.1.1"
description = "Step-by-step visual routine guides for children with autism"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    {name = "Daniel Nylander"}
]

[project.scripts]
rutinkompis = "rutinkompis.main:main"

[tool.setuptools.packages.find]
where = ["src"]
